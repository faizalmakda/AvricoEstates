# Keeps the free Supabase project from going to sleep. A free project pauses
# after ~7 days with no activity; this pings it every 2 days using the PUBLIC
# anon key (no secret needed), which is harmless and keeps it awake.
#
# It also keeps ITSELF alive: GitHub auto-disables scheduled workflows after 60
# days with no commits, so if the repo has been quiet for 50+ days this makes a
# tiny empty commit to reset that clock. So the pinger keeps running on its own
# indefinitely — nothing needed from anyone, even if the code is never touched.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 6 */2 * *' # every 2 days at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # allow the keepalive commit below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep VITE_SUPABASE_URL .env.production | cut -d= -f2)
          KEY=$(grep VITE_SUPABASE_ANON_KEY .env.production | cut -d= -f2)
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL/rest/v1/zones?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase responded: HTTP $code"
      - name: Keep this scheduled workflow from being auto-disabled
        run: |
          # Only commit if the repo has been quiet for a while, so normal
          # development never gets extra noise. [skip ci] stops it triggering
          # a pointless deploy, but the commit still counts as repo activity.
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit was $age days ago."
          if [ "$age" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive — keep scheduled workflows active [skip ci]"
            git push
            echo "Made a keepalive commit to reset GitHub's 60-day clock."
          else
            echo "Recent activity — no keepalive commit needed."
          fi
